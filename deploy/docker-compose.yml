# ==============================================================================
# TenPoint — Docker Compose (PRODUCTION / mặc định)
# Topology theo docs/03-sa/architecture.md mục 2:  caddy → (web | api) → db
#
# Chạy:   make up            (tương đương: docker compose -f deploy/docker-compose.yml up -d)
# Dev:    make dev           (thêm override deploy/docker-compose.dev.yml)
#
# LƯU Ý: Compose nạp file `.env` nằm CÙNG THƯ MỤC với file compose đầu tiên,
#        tức là `deploy/.env`. Copy từ `deploy/.env.example`.
# ==============================================================================

name: tenpoint

# --- Khối dùng lại ------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks: [tenpoint]

services:

  # ---------------------------------------------------------------------------
  # db — PostgreSQL 16 (nguồn sự thật duy nhất). ADR-001.
  # KHÔNG map cổng ra host ở production: DB chỉ được truy cập qua network nội bộ.
  # Muốn debug bằng psql từ máy host → dùng `make dev` (override mở 5432).
  # ---------------------------------------------------------------------------
  db:
    <<: *common
    image: postgres:16-alpine
    container_name: tenpoint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenpoint_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tenpoint}
      # initdb: locale + checksum dữ liệu
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tuning khiêm tốn cho VPS nhỏ (MVP: vài nghìn bài/tháng).
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - timezone=${TZ:-Asia/Ho_Chi_Minh}
    shm_size: 256mb
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenpoint} -d ${POSTGRES_DB:-tenpoint} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
        reservations:
          memory: 256m

  # ---------------------------------------------------------------------------
  # api — Go monolith: REST API + cron scheduler + ingest pipeline. ADR-002.
  # Migrations được embed trong binary và tự chạy khi khởi động.
  # Biến môi trường: đầy đủ theo architecture.md mục 12.
  # ---------------------------------------------------------------------------
  api:
    <<: *common
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${APP_VERSION:-dev}
    image: ${IMAGE_PREFIX:-tenpoint}/api:${APP_VERSION:-dev}
    container_name: tenpoint-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- HTTP ---
      PORT: "8080"
      # --- Database (mục 12) ---
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-tenpoint}:${POSTGRES_PASSWORD:-tenpoint_dev_only_change_me}@db:5432/${POSTGRES_DB:-tenpoint}?sslmode=disable
      # --- Múi giờ: BẮT BUỘC cho cron 06:00/14:00/22:00 giờ VN (ADR-004) ---
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # --- Cron ---
      CRON_SPEC: "${CRON_SPEC:-0 6,14,22 * * *}"
      CRON_ENABLED: "${CRON_ENABLED:-true}"
      # --- Summarizer (ADR-007: mặc định chạy được KHÔNG cần API key) ---
      SUMMARIZER_PROVIDER: ${SUMMARIZER_PROVIDER:-extractive}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # --- Admin ---
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # --- Short link tuyệt đối ---
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # --- Ingest / lịch sự với nguồn (NFR mục 11) ---
      FETCH_TIMEOUT_SEC: "${FETCH_TIMEOUT_SEC:-20}"
      MAX_ARTICLES_PER_SOURCE: "${MAX_ARTICLES_PER_SOURCE:-40}"
      USER_AGENT: "${USER_AGENT:-TenPointBot/1.0 (+https://tenpoint.vn/bot)}"
      # --- Nguồn tin được bật (PRD mục 4 — RÀNG BUỘC PHÁP LÝ) ---
      # tier0 = chỉ nguồn công bố chính thức (HOSE, HNX, UBCKNN, NHNN, TCTK).
      # Đổi sang `all` là QUYẾT ĐỊNH CỦA PHÁP CHẾ, không phải của DevOps.
      SOURCES_PROFILE: "${SOURCES_PROFILE:-tier0}"
      # --- Quan sát ---
      READY_MAX_AGE_HOURS: "${READY_MAX_AGE_HOURS:-26}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 128m

  # ---------------------------------------------------------------------------
  # web — Next.js SSR. Stateless.
  # SSR gọi thẳng api qua tên service nội bộ, không vòng qua Caddy (mục 2).
  # ---------------------------------------------------------------------------
  web:
    <<: *common
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_BASE_URL: http://api:8080
    image: ${IMAGE_PREFIX:-tenpoint}/web:${APP_VERSION:-dev}
    container_name: tenpoint-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Server-side (SSR) — KHÔNG lộ ra browser. Tên biến khớp frontend/.env.example.
      API_BASE_URL: http://api:8080
      # Hết timeout → FE render bằng dữ liệu mẫu thay vì lỗi 500.
      API_TIMEOUT_MS: "${API_TIMEOUT_MS:-4000}"
      # Client-side — dùng để dựng URL tuyệt đối trong metadata/sitemap/robots.
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768m
        reservations:
          memory: 128m

  # ---------------------------------------------------------------------------
  # caddy — reverse proxy + TLS tự động + nén + security headers (NFR mục 11).
  # SITE_ADDRESS = ":80" cho local, "tenpoint.vn" cho production (TLS tự động).
  # ---------------------------------------------------------------------------
  caddy:
    <<: *common
    image: caddy:2-alpine
    container_name: tenpoint-caddy
    depends_on:
      - web
      - api
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      ACME_EMAIL: "${ACME_EMAIL:-devops@example.com}"
      # CSP script-src: xem ghi chú trong deploy/Caddyfile.
      CSP_SCRIPT_SRC: "${CSP_SCRIPT_SRC:-'self' 'unsafe-inline'}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # chứng chỉ TLS — MẤT VOLUME NÀY = XIN LẠI CERT
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "caddy version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
        reservations:
          memory: 64m

# ------------------------------------------------------------------------------
networks:
  tenpoint:
    name: tenpoint
    driver: bridge

volumes:
  pgdata:
    name: tenpoint_pgdata
  caddy_data:
    name: tenpoint_caddy_data
  caddy_config:
    name: tenpoint_caddy_config
