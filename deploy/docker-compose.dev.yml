# ==============================================================================
# TenPoint — override cho môi trường DEV / DEMO / QA
#
# Dùng kèm (KHÔNG dùng một mình):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
#   hoặc gọn hơn:  make dev
#
# Khác biệt so với production:
#   1. Mở cổng db:5432, api:8080, web:3000 ra host để debug trực tiếp.
#   2. Log verbose (LOG_LEVEL=debug, LOG_FORMAT=text, Caddy DEBUG).
#   3. CRON_ENABLED=false — cron KHÔNG tự chạy, tránh chen ngang khi đang test.
#      Muốn chạy pipeline thủ công:  make ingest
#   4. Caddy luôn ở chế độ HTTP thuần (:80), không xin chứng chỉ TLS.
# ==============================================================================

name: tenpoint

services:

  db:
    # ⚠️ Chỉ bind vào 127.0.0.1 — không phơi Postgres ra LAN.
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - timezone=${TZ:-Asia/Ho_Chi_Minh}
      # Log mọi statement chậm > 200ms để soi query của pipeline.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_statement=ddl

  api:
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8080}:8080"
    environment:
      # Tắt cron: test không bị pipeline chạy chen ngang.
      CRON_ENABLED: "false"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "text"
      # Dev/Demo/QA bật TOÀN BỘ nguồn (Tier 0 + 1 + 2) — PRD mục 4.
      # Production chỉ Tier 0. Biến này là gợi ý cho seed/migration của BE.
      SOURCES_PROFILE: "${SOURCES_PROFILE:-all}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
    restart: unless-stopped

  web:
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-3000}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
    # SSR vẫn cần api sống, nhưng ở dev cho phép khởi động sớm để xem UI lỗi.
    depends_on:
      api:
        condition: service_started

  caddy:
    environment:
      # Ép HTTP thuần ở dev — không gọi Let's Encrypt, không dính rate limit ACME.
      SITE_ADDRESS: ":80"
      CADDY_DEBUG: "debug"
    # Cổng host vẫn lấy từ HTTP_PORT / HTTPS_PORT trong deploy/.env
    # (không override ở đây để tránh map trùng cổng 80 hai lần).
